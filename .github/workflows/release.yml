name: Release

on:
  push:
    branches:
      - main
    # le site, la doc et les specs ne sont pas du code : pas de release pour eux
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'specs/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use newest installed Xcode (Swift 6 toolchain)
        run: |
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          swift --version

      - name: Test
        run: swift test

      # Calcule la version sans rien tagger : le tag naît avec la release, une fois
      # le DMG construit. Un build cassé ne peut donc plus laisser de tag orphelin.
      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            # push sur main : bump automatique du patch depuis le dernier tag
            LAST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
            LAST="${LAST#v}"
            LAST="${LAST:-0.0.0}"
            MAJOR="${LAST%%.*}"
            REST="${LAST#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            V="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build app + DMG
        run: bash package.sh "${{ steps.v.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          DMG="dist/Cubby-$V.dmg"
          # le ZIP est l'artefact que Sparkle télécharge pour mettre à jour
          # une app déjà installée ; le DMG reste la première installation
          ZIP="dist/Cubby-$V.zip"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$DMG" "$ZIP" --clobber
          else
            gh release create "v$V" --title "Cubby $V" --target "$GITHUB_SHA" \
              --notes "Automated release. Open the DMG and drag Cubby into Applications. Cubby is ad-hoc signed (not notarized): on first launch, open System Settings › Privacy & Security and click Open Anyway (on macOS 14, right-click Cubby.app › Open). Requires macOS 14+." \
              "$DMG" "$ZIP"
          fi

      # Le flux Sparkle vit sur main, dans docs/ — couvert par paths-ignore,
      # donc ce commit ne redéclenche pas de release. On repart de origin/main
      # pour que l'étape marche aussi depuis un tag ou un workflow_dispatch.
      - name: Update appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          git fetch origin main
          git checkout -B appcast origin/main
          python3 scripts/appcast.py "$V" "dist/Cubby-$V.zip"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git diff --cached --quiet || git commit -m "chore: appcast v$V"
          git push origin appcast:main
